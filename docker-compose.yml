services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["redis-server", "--appendonly", "yes"]
    # 默认不暴露到宿主机；后端通过 Docker 内网 redis:6379 访问。
    # 本机调试如需访问 127.0.0.1:6379，请启用 docker-compose.debug.yml。
    # ports:
    #   - "${DEBUG_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  subconverter:
    image: tindy2013/subconverter:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    # 默认不暴露到宿主机；后端通过 Docker 内网 subconverter:25500 访问。
    # 本机调试如需访问 127.0.0.1:25500，请启用 docker-compose.debug.yml。
    # ports:
    #   - "${DEBUG_BIND_HOST:-127.0.0.1}:${SUBCONVERTER_PORT:-25500}:25500"

  mihomo:
    image: metacubex/mihomo:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MIHOMO_API_SECRET: ${MIHOMO_API_SECRET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /root/.config/mihomo/mihomo-runtime.yaml ]; then
          printf '%s\n' \
            'allow-lan: true' \
            'mode: rule' \
            'log-level: info' \
            'external-controller: 0.0.0.0:9090' \
            'proxies: []' \
            'proxy-groups: []' \
            'listeners: []' \
            'rules:' \
            '  - MATCH,DIRECT' \
            > /root/.config/mihomo/mihomo-runtime.yaml
          if [ -n "$$MIHOMO_API_SECRET" ]; then
            printf 'secret: %s\n' "$$MIHOMO_API_SECRET" >> /root/.config/mihomo/mihomo-runtime.yaml
          fi
        fi
        exec /mihomo -d /root/.config/mihomo -f /root/.config/mihomo/mihomo-runtime.yaml
    volumes:
      - ./backend/data:/root/.config/mihomo
    ports:
      # 默认不暴露 Mihomo External Controller；后端通过 Docker 内网 mihomo:9090 访问。
      # 本机调试如需访问 127.0.0.1:9090，请启用 docker-compose.debug.yml。
      # - "${DEBUG_BIND_HOST:-127.0.0.1}:${MIHOMO_API_PORT:-9090}:9090"
      - "${SMART_PROXY_BIND_HOST:-127.0.0.1}:${SMART_PROXY_PORT_START:-37890}-${SMART_PROXY_PORT_END:-37900}:${SMART_PROXY_PORT_START:-37890}-${SMART_PROXY_PORT_END:-37900}"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_ENV: ${APP_ENV:-production}
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      SUBSCRIPTION_TOKEN: ${SUBSCRIPTION_TOKEN:-nebula-sub-token}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/nebula.db}
      SQL_ECHO: ${SQL_ECHO:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SUBCONVERTER_URL: ${SUBCONVERTER_URL:-http://subconverter:25500}
      SUBCONVERTER_TIMEOUT_SECONDS: ${SUBCONVERTER_TIMEOUT_SECONDS:-45}
      MIHOMO_API_URL: ${MIHOMO_API_URL:-http://mihomo:9090}
      MIHOMO_API_SECRET: ${MIHOMO_API_SECRET:-}
      MIHOMO_RUNTIME_CONFIG_PATH: ${MIHOMO_RUNTIME_CONFIG_PATH:-/app/data/mihomo-runtime.yaml}
      MIHOMO_CORE_CONFIG_PATH: ${MIHOMO_CORE_CONFIG_PATH:-/root/.config/mihomo/mihomo-runtime.yaml}
      MIHOMO_PROXY_SERVER_NAMESERVERS: ${MIHOMO_PROXY_SERVER_NAMESERVERS:-127.0.0.11}
      ANT_ADAPTER_BIND_HOST: ${ANT_ADAPTER_BIND_HOST:-0.0.0.0}
      ANT_ADAPTER_CONNECT_HOST: ${ANT_ADAPTER_CONNECT_HOST:-backend}
      ANT_PROXY_AUTO_REFRESH_ENABLED: ${ANT_PROXY_AUTO_REFRESH_ENABLED:-true}
      ANT_PROXY_AUTO_REFRESH_INTERVAL_MINUTES: ${ANT_PROXY_AUTO_REFRESH_INTERVAL_MINUTES:-360}
      SMART_PROXY_PORT_START: ${SMART_PROXY_PORT_START:-37890}
      SMART_PROXY_PORT_END: ${SMART_PROXY_PORT_END:-37900}
      SMART_PROXY_BIND_HOST: ${SMART_PROXY_BIND_HOST:-127.0.0.1}
      SMART_PROXY_AUTO_APPLY_INTERVAL_MINUTES: ${SMART_PROXY_AUTO_APPLY_INTERVAL_MINUTES:-0}
      SMART_PROXY_MONITOR_INTERVAL_MINUTES: ${SMART_PROXY_MONITOR_INTERVAL_MINUTES:-1}
      SMART_PROXY_TRAFFIC_GUARD_ENABLED: ${SMART_PROXY_TRAFFIC_GUARD_ENABLED:-true}
      SMART_PROXY_MIN_REMAINING_MB: ${SMART_PROXY_MIN_REMAINING_MB:-0}
      SMART_PROXY_LOW_REMAINING_MB: ${SMART_PROXY_LOW_REMAINING_MB:-2048}
      SMART_PROXY_EXPIRE_SOON_DAYS: ${SMART_PROXY_EXPIRE_SOON_DAYS:-3}
      SMART_PROXY_EXCLUDE_UNKNOWN_TRAFFIC: ${SMART_PROXY_EXCLUDE_UNKNOWN_TRAFFIC:-false}
      ACL4SSR_CONFIG_URL: ${ACL4SSR_CONFIG_URL:-https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/config/ACL4SSR_Online.ini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8088,http://localhost:5173}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-600}
      URL_BLOCK_PRIVATE_NETWORKS: ${URL_BLOCK_PRIVATE_NETWORKS:-true}
      URL_ALLOWLIST: ${URL_ALLOWLIST:-}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-180}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_TRUST_PROXY_HEADERS: ${RATE_LIMIT_TRUST_PROXY_HEADERS:-true}
    volumes:
      - ./backend/data:/app/data
    ports:
      - "${INTERNAL_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8001}:8001"
    depends_on:
      - redis
      - subconverter
      - mihomo

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  redis-data:
