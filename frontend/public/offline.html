<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d140f" />
    <title>Nebula 离线</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1d140f;
        color: #efe2cf;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(420px, 100%);
        border: 1px solid #4a392b;
        border-radius: 20px;
        background: #2b2018;
        padding: 22px;
        box-shadow: 0 22px 54px rgba(22, 12, 6, 0.34);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: #b7a692;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nebula 暂时离线</h1>
      <p>当前网络不可用，已保留应用外壳。恢复连接后刷新页面即可继续使用控制台。</p>
    </main>
  </body>
</html>
