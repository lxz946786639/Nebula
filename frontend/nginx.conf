map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 使用 Docker 内置 DNS 按请求解析 backend。
  # 若用静态 proxy_pass http://backend:8001/，nginx 只在启动时解析一次并永久缓存
  # IP；backend 容器重建后 IP 变化，就会一直 502 直到重启 frontend。
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend_upstream backend:8001;
    proxy_pass http://$backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location /health {
    set $backend_upstream backend:8001;
    proxy_pass http://$backend_upstream$request_uri;
  }

  location = /sw.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = /offline.html {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
